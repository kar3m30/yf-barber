<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>يوسف فاروق — حجز موعد</title>
  <style>
    :root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2d;--text:#f4f1e9;--muted:#aaa7a0;--gold:#c9a86a;--danger:#e85b5b;--ok:#65c58a}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#25211a 0,#0b0b0c 42%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:24px 16px 50px}
    header{text-align:center;padding:18px 0 26px}
    .logo{width:70px;height:70px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:var(--gold);font-size:24px;font-weight:700}
    h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:8px}
    .card{background:rgba(21,21,23,.95);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 18px 50px #0006}
    label{display:block;margin:0 0 7px;font-size:14px;color:#ddd}
    input,select,button{width:100%;font:inherit;border-radius:12px;padding:13px;border:1px solid var(--line);background:#0f0f11;color:var(--text)}
    input:focus,select:focus{outline:1px solid var(--gold);border-color:var(--gold)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}
    .full{grid-column:1/-1}
    button{border:0;background:linear-gradient(135deg,#d6b574,#9d7739);color:#111;font-weight:700;cursor:pointer;padding:14px}
    button:disabled{opacity:.55;cursor:not-allowed}
    .message{padding:12px;border-radius:12px;margin:12px 0;display:none;white-space:pre-line}
    .message.show{display:block}.error{background:#3a1717;color:#ffb0b0}.success{background:#123121;color:#a9efc3}
    .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:300px;overflow:auto}
    .slot{padding:10px;border:1px solid var(--line);border-radius:10px;background:#101012;color:var(--text);cursor:pointer}
    .slot.full{background:#261313;color:#777;cursor:not-allowed}.slot.selected{outline:2px solid var(--gold);background:#241d12}
    .slot small{display:block;color:var(--muted);margin-top:3px}
    .hidden{display:none!important}
    .booking{text-align:center}.booking .number{font-size:54px;color:var(--gold);font-weight:800}
    .qr{background:white;padding:12px;border-radius:12px;display:inline-block;margin:14px 0}.qr img{display:block;width:220px;height:220px}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:right}.detail{border:1px solid var(--line);border-radius:10px;padding:10px}.detail b{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
    .note{color:var(--muted);font-size:13px;line-height:1.7;text-align:center}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">YF</div>
    <h1>يوسف فاروق</h1>
    <div class="sub">احجز موعدك بسهولة</div>
  </header>

  <section id="bookingSection" class="card">
    <form id="bookingForm" novalidate>
      <div class="grid">
        <div class="field">
          <label for="name">الاسم</label>
          <input id="name" name="name" autocomplete="name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <input id="phone" name="phone" inputmode="tel" maxlength="30" required>
        </div>
        <div class="field full">
          <label for="service">الخدمة</label>
          <select id="service" name="service" required>
            <option value="">اختر الخدمة</option>
            <option value="قص شعر">قص شعر</option>
            <option value="حلاقة">حلاقة</option>
            <option value="قص شعر + حلاقة">قص شعر + حلاقة</option>
            <option value="أطفال">أطفال</option>
          </select>
        </div>
        <div class="field">
          <label for="date">التاريخ</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="field">
          <label>الوقت</label>
          <input id="time" name="time" type="hidden" required>
          <div id="slots" class="slots"></div>
        </div>
      </div>

      <div id="message" class="message"></div>
      <button id="submitButton" type="submit">تأكيد الحجز</button>
    </form>
  </section>

  <section id="bookingCard" class="card booking hidden">
    <h2>تم تأكيد الحجز ✓</h2>
    <div class="sub">رقم دورك</div>
    <div id="queue" class="number">—</div>
    <div id="qrBox" class="qr"></div>
    <div class="details">
      <div class="detail"><b>الاسم</b><span id="outName"></span></div>
      <div class="detail"><b>الهاتف</b><span id="outPhone"></span></div>
      <div class="detail"><b>الخدمة</b><span id="outService"></span></div>
      <div class="detail"><b>التاريخ</b><span id="outDate"></span></div>
      <div class="detail"><b>الوقت</b><span id="outTime"></span></div>
      <div class="detail"><b>المقعد</b><span id="outSlot"></span></div>
    </div>
    <p class="note">احتفظ بهذه البطاقة وأظهر رمز QR عند الوصول.</p>
    <button type="button" onclick="location.reload()">حجز موعد جديد</button>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
