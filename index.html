<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>يوسف فاروق | حجز المواعيد</title><meta name="theme-color" content="#0d2b22"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
:root{--bg:#071812;--panel:#0d241c;--panel2:#123126;--gold:#d8b56a;--gold2:#f0d28d;--text:#f7f1e4;--muted:#b8c4bc;--red:#d96b6b;--green:#65c99a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173b2d 0,#071812 45%,#04100c 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #365447;padding:12px 0 18px}.brand{font-size:26px;font-weight:800;color:var(--gold2)}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #4d6d5d;background:#102b21;color:var(--text);padding:10px 14px;border-radius:12px}.btn.primary{background:linear-gradient(135deg,#c49b4e,#efd38d);color:#152219;border:0;font-weight:800}.btn.danger{background:#3a1717;border-color:#713737}.hero{padding:38px 0 20px;text-align:center}.hero h1{font-size:42px;margin:0;color:var(--gold2)}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:linear-gradient(180deg,#102a20,#0b2119);border:1px solid #315445;border-radius:20px;padding:20px;box-shadow:0 18px 50px #0005}.field{margin-bottom:13px}.field label{display:block;margin-bottom:7px;color:var(--gold2)}input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #496658;background:#071812;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--gold)}.hint{font-size:12px;color:var(--muted);margin-top:6px}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin:10px 0}.err{background:#3b1717;color:#ffd4d4}.ok{background:#123a29;color:#c9ffe1}.booking{max-width:600px;margin:24px auto}.booking .qr{display:flex;justify-content:center;background:white;padding:15px;border-radius:14px;width:max-content;margin:18px auto}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info div{background:#091b15;padding:12px;border-radius:10px}.info b{display:block;color:var(--gold2);font-size:12px;margin-bottom:4px}.queue-list{display:grid;gap:8px}.row{display:grid;grid-template-columns:70px 1fr 120px 110px;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #284638}.badge{padding:6px 9px;border-radius:9px;background:#18392b;text-align:center;font-size:12px}.badge.serving{background:#594a1b}.badge.done{background:#183b2b}.badge.cancelled{background:#461b1b}.admin-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #294a3c;text-align:right}.table th{color:var(--gold2)}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .card{width:min(430px,100%)}.footer{text-align:center;color:#82988d;padding:30px 0}.slot-full{color:#ffb1b1;font-size:11px}.scanbox{border:1px dashed #547465;border-radius:15px;padding:20px;text-align:center}.stat{font-size:30px;color:var(--gold2);font-weight:800}.muted{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.row{grid-template-columns:55px 1fr 95px}.row .phone{display:none}.info{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">YF <span>يوسف فاروق</span><small>حجزك يبدأ من هنا</small></div><nav class="nav"><button class="btn" data-page="book">حجز موعد</button><button class="btn" data-page="ticket">بطاقة الحجز</button><button class="btn" data-page="queue">الدور اليوم</button><a class="btn" href="/admin">لوحة الإدارة</a></nav></header>
<main id="app"></main><footer class="footer">© يوسف فاروق — جميع الحقوق محفوظة</footer></div>
<div id="loginModal" class="modal hidden"><div class="card"><h2>دخول لوحة الإدارة</h2><div id="loginMsg"></div><div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>الرمز</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">دخول</button></div></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');let current=JSON.parse(localStorage.getItem('yf_booking')||'null');let meta={times:[],services:[],today:''};let adminToken=localStorage.getItem('yf_admin_token')||'';
const api=async(url,opt={})=>{const r=await fetch('/api'+url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'حدث خطأ');return j};
function msg(t,ok=false){return `<div class="msg ${ok?'ok':'err'}">${t}</div>`}
async function boot(){meta=await api('/meta'); if(location.pathname==='/admin'){renderAdmin();return} renderBook();}
function renderBook(){app.innerHTML=`<section class="hero"><h1>احجز موعدك</h1><p>كل تاريخ له دور مستقل، وكل موعد يستقبل بحد أقصى عميلين.</p></section><section class="grid"><div class="card"><h2>بيانات الحجز</h2><div id="formMsg"></div><form id="bookingForm"><div class="field"><label>الاسم الكامل</label><input id="name" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" required></div><div class="field"><label>الخدمة</label><select id="service" required>${meta.services.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="date" type="date" min="${meta.today}" value="${meta.today}" required></div><div class="field"><label>الوقت</label><select id="time" required>${meta.times.map(x=>`<option>${x}</option>`).join('')}</select><div class="hint">يمكن حجز عميلين فقط لنفس التاريخ ونفس الوقت.</div></div><button class="btn primary" style="width:100%;padding:14px">تأكيد الحجز</button></form></div><div class="card"><h2>كيف يعمل؟</h2><p class="muted">1) اختر التاريخ والوقت.</p><p class="muted">2) إذا كان الموعد غير مكتمل، سيتم إنشاء بطاقة حجز مباشرة.</p><p class="muted">3) احتفظ برقم الدور وQR عند وصولك.</p></div></section>`;$('#bookingForm').onsubmit=book;}
async function book(e){e.preventDefault();$('#formMsg').innerHTML='';try{const j=await api('/bookings',{method:'POST',body:JSON.stringify({name:$('#name').value,phone:$('#phone').value,service:$('#service').value,date:$('#date').value,time:$('#time').value})});current=j.booking;localStorage.setItem('yf_booking',JSON.stringify(current));renderTicket();}catch(e){$('#formMsg').innerHTML=msg(e.message)}}
function renderTicket(){if(!current){app.innerHTML=`<div class="card"><h2>لا توجد بطاقة حجز</h2><button class="btn primary" onclick="renderBook()">احجز الآن</button></div>`;return}app.innerHTML=`<section class="hero"><h1>تم تأكيد الحجز</h1><p>احتفظ بهذه البطاقة حتى موعدك.</p></section><div class="card booking"><div class="info"><div><b>الاسم</b>${esc(current.name)}</div><div><b>الهاتف</b>${esc(current.phone)}</div><div><b>الخدمة</b>${esc(current.service)}</div><div><b>التاريخ</b>${esc(current.date)}</div><div><b>الوقت</b>${esc(current.time)}</div><div><b>الدور</b><span class="stat">${current.queue}</span></div></div><div id="qr" class="qr"></div><p class="muted" style="text-align:center">رمز الحجز: ${esc(current.token)}</p><button class="btn" onclick="renderQueue()" style="width:100%">متابعة الدور</button></div>`;new QRCode($('#qr'),{text:current.token,width:190,height:190,colorDark:'#071812',colorLight:'#ffffff'});}
function renderQueue(){app.innerHTML=`<section class="hero"><h1>الدور اليوم</h1><p>اختر يومًا لمشاهدة ترتيب الحجوزات.</p></section><div class="card"><div class="admin-tools"><div class="field" style="min-width:230px;flex:1"><label>التاريخ</label><input id="queueDate" type="date" min="${meta.today}" value="${meta.today}"></div><button class="btn primary" id="loadQueue">عرض الدور</button></div><div id="queueMsg"></div><div id="queueList" class="queue-list"></div></div>`;$('#loadQueue').onclick=loadQueue;loadQueue();}
async function loadQueue(){try{const d=$('#queueDate').value,j=await api('/queue?date='+encodeURIComponent(d));$('#queueList').innerHTML=j.bookings.length?j.bookings.map(b=>`<div class="row"><div class="badge">#${b.queue}</div><div><b>${esc(b.name)}</b><div class="muted">${esc(b.service)} — ${esc(b.time)}</div></div><div class="phone">${esc(b.phone)}</div><div class="badge ${b.status}">${statusText(b.status)}</div></div>`).join(''):'<p class="muted">لا توجد حجوزات لهذا اليوم.</p>'}catch(e){$('#queueMsg').innerHTML=msg(e.message)}}
function renderAdmin(){if(!adminToken){$('#loginModal').classList.remove('hidden');app.innerHTML=`<div class="card"><h2>لوحة الإدارة</h2><p class="muted">سجّل الدخول للوصول إلى الحجوزات وإدارة الدور.</p></div>`;return}adminHome();}
async function adminHome(){try{await api('/admin/me',{headers:{Authorization:'Bearer '+adminToken}})}catch{adminToken='';localStorage.removeItem('yf_admin_token');renderAdmin();return}app.innerHTML=`<section class="hero"><h1>لوحة الإدارة</h1><p>إدارة الحجوزات والدور حسب اليوم.</p></section><div class="card"><div class="admin-tools"><div class="field" style="flex:1;min-width:220px"><label>تاريخ الإدارة</label><input id="adminDate" type="date" min="${meta.today}" value="${meta.today}"></div><button class="btn primary" id="refreshAdmin">تحديث</button><button class="btn" id="nextBtn">استدعاء التالي</button><button class="btn danger" id="logoutBtn">خروج</button></div><div id="adminMsg"></div><div id="adminStats"></div><div class="table"><table><thead><tr><th>الدور</th><th>العميل</th><th>الهاتف</th><th>الخدمة</th><th>الوقت</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="adminBody"></tbody></table></div></div><div class="card" style="margin-top:18px"><h2>قارئ QR</h2><div class="scanbox"><p class="muted">استخدم ماسح الهاتف لقراءة QR، أو الصق رمز الحجز هنا.</p><input id="scanToken" placeholder="رمز الحجز"><button class="btn primary" id="scanBtn" style="margin-top:10px">بحث</button><div id="scanResult"></div></div></div>`;$('#refreshAdmin').onclick=loadAdmin;$('#nextBtn').onclick=nextCustomer;$('#logoutBtn').onclick=()=>{adminToken='';localStorage.removeItem('yf_admin_token');renderAdmin()};$('#scanBtn').onclick=scanBooking;loadAdmin();}
async function loadAdmin(){try{const j=await api('/admin/bookings?date='+encodeURIComponent($('#adminDate').value),{headers:{Authorization:'Bearer '+adminToken}});$('#adminStats').innerHTML=`<p class="muted">عدد الحجوزات: <span class="stat">${j.bookings.length}</span></p>`;$('#adminBody').innerHTML=j.bookings.map(b=>`<tr><td>#${b.queue}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${esc(b.service)}</td><td>${esc(b.time)}</td><td><span class="badge ${b.status}">${statusText(b.status)}</span></td><td>${actions(b)}</td></tr>`).join('');document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>changeStatus(x.dataset.id,x.dataset.status));}catch(e){$('#adminMsg').innerHTML=msg(e.message)}}
function actions(b){if(b.status==='waiting')return `<button class="btn" data-id="${b.id}" data-status="serving">بدء</button> <button class="btn danger" data-id="${b.id}" data-status="cancelled">إلغاء</button>`;if(b.status==='serving')return `<button class="btn primary" data-id="${b.id}" data-status="done">تمت الخدمة</button>`;return `<button class="btn" data-id="${b.id}" data-status="waiting">إرجاع للانتظار</button>`}
async function changeStatus(id,status){try{await api('/admin/bookings/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+adminToken},body:JSON.stringify({status})});loadAdmin()}catch(e){$('#adminMsg').innerHTML=msg(e.message)}}
async function nextCustomer(){try{const j=await api('/admin/next',{method:'POST',headers:{Authorization:'Bearer '+adminToken},body:JSON.stringify({date:$('#adminDate').value})});$('#adminMsg').innerHTML=msg(`تم استدعاء #${j.booking.queue} — ${esc(j.booking.name)}`,true);loadAdmin()}catch(e){$('#adminMsg').innerHTML=msg(e.message)}}
async function scanBooking(){try{const j=await api('/admin/scan/'+encodeURIComponent($('#scanToken').value.trim()),{headers:{Authorization:'Bearer '+adminToken}});const b=j.booking;$('#scanResult').innerHTML=`<div class="msg ok"><b>${esc(b.name)}</b><br>الدور #${b.queue}<br>${esc(b.date)} — ${esc(b.time)}<br>${esc(b.phone)}<br>الحالة: ${statusText(b.status)}</div>`}catch(e){$('#scanResult').innerHTML=msg(e.message)}}
$('#loginBtn').onclick=async()=>{try{const j=await api('/admin/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value,password:$('#loginPass').value})});adminToken=j.token;localStorage.setItem('yf_admin_token',adminToken);$('#loginModal').classList.add('hidden');if(location.pathname==='/admin')adminHome();}catch(e){$('#loginMsg').innerHTML=msg(e.message)}};
function statusText(s){return ({waiting:'منتظر',serving:'قيد الخدمة',done:'تمت الخدمة',cancelled:'ملغي'})[s]||s}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='book')renderBook();if(b.dataset.page==='ticket')renderTicket();if(b.dataset.page==='queue')renderQueue();});boot().catch(e=>{app.innerHTML=`<div class="card">${msg(e.message)}</div>`});
</script></body></html>
